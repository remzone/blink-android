plugins { id 'com.android.application' }
android {
    namespace 'com.remzone.blink.tv'
    compileSdk 34
    defaultConfig { applicationId 'com.remzone.blink.tv'; minSdk 26; targetSdk 34; versionCode 5; versionName '0.4.0' }
    splits { abi { enable true; reset(); include 'armeabi-v7a', 'arm64-v8a', 'x86_64'; universalApk true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'com.vk.id.captcha:vkid-captcha:0.0.16'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'androidx.core:core:1.13.1'
    implementation files('../native/blinkcore.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
