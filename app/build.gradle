plugins { id 'com.android.application' }
android {
    namespace 'com.remzone.blink.tv'
    compileSdk 34
    defaultConfig { applicationId 'com.remzone.blink.tv'; minSdk 26; targetSdk 34; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation files('../native/blinkcore.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
